mautic.multimail.provider.sparkpost.help="Use uma chave de API com permissão de escrita em Transmissions. Escolha a região da conta; as chaves US e EU são separadas. O MIME do Mautic é mantido; o SparkPost gerencia o endereço de retorno."
mautic.multimail.provider.smtp2go.help="Use uma chave de API com permissão email/send e um remetente ou domínio verificado. Anexos são enviados como dados, sem buscar URLs remotas."

