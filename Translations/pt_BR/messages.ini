mautic.multimail.mailjet.secret="Chave secreta do Mailjet"
mautic.multimail.provider.mailjet.help="Use a API Key e a Secret Key da mesma conta Mailjet. Verifique o remetente ou domínio antes do teste."
mautic.multimail.provider.mailersend.help="Use um token de API com acesso de envio e um domínio verificado. O adaptador padrão não envia cabeçalhos personalizados de rastreamento ou descadastro; use SMTP quando esses cabeçalhos forem necessários."
mautic.multimail.provider.mandrill.help="Use uma chave de API do Mailchimp Transactional (Mandrill) e um domínio de envio autenticado."
mautic.multimail.provider.sparkpost.help="Use uma chave de API com permissão de escrita em Transmissions. Escolha a região da conta; as chaves US e EU são separadas. O MIME do Mautic é mantido; o SparkPost gerencia o endereço de retorno."
mautic.multimail.provider.smtp2go.help="Use uma chave de API com permissão email/send e um remetente ou domínio verificado. Anexos são enviados como dados, sem buscar URLs remotas."

