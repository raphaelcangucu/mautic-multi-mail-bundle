name: Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        symfony: [locked, mautic-baseline]
    name: PHP ${{ matrix.php }} / ${{ matrix.symfony }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: mbstring, openssl, curl
      - run: composer validate --no-check-publish
      - run: composer install --working-dir=build/dependencies --no-interaction --no-progress --prefer-dist
      - if: matrix.symfony == 'mautic-baseline'
        run: >-
          composer update --working-dir=build/dependencies
          symfony/mailer:7.4.12 symfony/http-client:7.4.9 symfony/mime:7.4.13
          symfony/event-dispatcher:7.4.14 symfony/dependency-injection:7.4.14
          --with-all-dependencies --no-interaction --no-progress
      - run: find Application Command Config Controller Conversation DependencyInjection EventSubscriber Form Imap Inbox Mailer Meta Tests -name '*.php' -exec php -l '{}' ';'
      - run: php -l MauticMultiMailBundle.php
      - run: node --check Assets/js/connections.js
      - run: node Tests/connections-ui.cjs
      - run: node Tests/quota-ui.cjs
      - run: node Tests/conversation-ui.cjs
      - run: php Tests/connections.php
      - run: php Tests/transports.php
      - run: php Tests/provider-transports.php
      - run: php Tests/native-compatibility.php
      - run: php Tests/example-sending.php
      - run: php Tests/hourly-quotas.php
      - run: php Tests/period-quotas.php
      - run: php Tests/quota-template.php
      - run: php Tests/thread-token.php
      - run: php Tests/outbound-email.php
      - run: php Tests/imap-client.php
      - run: php Tests/inbound-parsing.php
      - run: php Tests/threading.php
      - run: php Tests/imap-poller.php
      - run: php Tests/email-dispatcher.php
      - run: php Tests/email-ingestion.php
      - run: php Tests/round-trip.php
      - run: python3 build/package.py

  greenmail-e2e:
    # Real SMTPS/IMAPS round trip. GreenMail binds 465/993 (the ports the connection
    # validator accepts) through sudo, with a throw-away CA trusted in the system store.
    runs-on: ubuntu-latest
    name: GreenMail e2e (PHP 8.4)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, openssl, curl, fileinfo
      - run: composer install --working-dir=build/dependencies --no-interaction --no-progress --prefer-dist
      - name: GreenMail 2.1.3 (Maven Central, pinned checksum)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/greenmail-standalone.jar" https://repo1.maven.org/maven2/com/icegreen/greenmail-standalone/2.1.3/greenmail-standalone-2.1.3.jar
          echo "9457fdaf45ded6c87bf84a321a5ced4b4b5e72b1d03686b778df381378afc4c8  $RUNNER_TEMP/greenmail-standalone.jar" | sha256sum -c -
      - run: GREENMAIL_JAR="$RUNNER_TEMP/greenmail-standalone.jar" GREENMAIL_DIR="$RUNNER_TEMP/greenmail" bash bin/greenmail.sh start
      - run: GREENMAIL=1 php Tests/greenmail-e2e.php
      - if: always()
        run: bash bin/greenmail.sh stop
